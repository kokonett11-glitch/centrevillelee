    <!-- Netlify Badge & Drawer Force Hide -->
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe#nl-badge-frame,
      iframe#nl-hud-frame,
      iframe[id*="nl-badge"],
      iframe[id*="nl-hud"],
      iframe[id*="nl-"],
      iframe[srcdoc*="Powered by"],
      iframe[srcdoc*="Netlify"],
      netlify-drawer,
      #netlify-drawer-iframe,
      iframe[src*="netlify"],
      [data-netlify-drawer],
      .netlify-badge,
      #netlify-badge,
      [data-netlify-badge],
      div[class*="netlify-drawer"],
      div[class*="netlify-badge"],
      div[class*="feedback"],
      a[href*="netlify.com"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -99999px !important;
        left: -99999px !important;
        width: 0 !important;
        height: 0 !important;
        z-index: -999999 !important;
      }
    </style>
    <script>
      (function() {
        try {
          localStorage.setItem("nl-hud:public:v1", "hidden");
          localStorage.setItem("nl-hud:owner-private:v1", "hidden");
        } catch(e) {}
        function removeNetlifyBadges() {
          try {
            localStorage.setItem("nl-hud:public:v1", "hidden");
            localStorage.setItem("nl-hud:owner-private:v1", "hidden");
          } catch(e) {}
          const selectors = [
            '#nl-badge-frame',
            '#nl-hud-frame',
            'iframe#nl-badge-frame',
            'iframe#nl-hud-frame',
            'iframe[id*="nl-"]',
            'iframe[srcdoc*="Netlify"]',
            'iframe[srcdoc*="Powered by"]',
            'script[src*="/.netlify/scripts/hud"]',
            'netlify-drawer',
            '#netlify-drawer-iframe',
            'iframe[src*="netlify"]',
            '[data-netlify-drawer]',
            '.netlify-badge',
            '#netlify-badge',
            '[data-netlify-badge]',
            'a[href*="netlify.com"]'
          ];
          selectors.forEach(function(sel) {
            try {
              document.querySelectorAll(sel).forEach(function(el) {
                if (el.tagName === 'IFRAME') el.remove();
                else if (el.id !== 'nl-badge-frame' && el.id !== 'nl-hud-frame') el.remove();
              });
            } catch(e) {}
          });
        }
        removeNetlifyBadges();
        document.addEventListener('DOMContentLoaded', removeNetlifyBadges);
        window.addEventListener('load', removeNetlifyBadges);
        setInterval(removeNetlifyBadges, 100);

        if (window.MutationObserver) {
          new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
              m.addedNodes.forEach(function(node) {
                if (node.nodeType === 1) {
                  if (
                    node.tagName === 'IFRAME' &&
                    (node.id === 'nl-badge-frame' || node.id === 'nl-hud-frame' || (node.id && node.id.includes('nl-')))
                  ) {
                    node.remove();
                  } else if (node.tagName === 'SCRIPT' && node.src && node.src.includes('hud')) {
                    node.remove();
                  }
                }
              });
            });
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
