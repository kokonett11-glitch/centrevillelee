    <script>
      (function() {
        function removeNetlifyBadges() {
          const selectors = [
            'netlify-drawer',
            '#netlify-drawer-iframe',
            'iframe[src*="netlify"]',
            '[data-netlify-drawer]',
            '.netlify-badge',
            '#netlify-badge',
            '[data-netlify-badge]',
            'a[href*="netlify.com"]'
          ];
          selectors.forEach(function(sel) {
            try {
              document.querySelectorAll(sel).forEach(function(el) { el.remove(); });
            } catch(e) {}
          });
        }
        document.addEventListener('DOMContentLoaded', removeNetlifyBadges);
        window.addEventListener('load', removeNetlifyBadges);
        setInterval(removeNetlifyBadges, 300);
      })();
    </script>
